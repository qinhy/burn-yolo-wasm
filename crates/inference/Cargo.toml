[package]
name = "burn-yolo-inference"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
burn = { version = "=0.22.1", default-features = false, features = ["std", "flex", "webgpu"] }
burn-store = "=0.22.1"
burn-cubecl = { version = "=0.22.1", default-features = false, features = ["webgpu"] }
cubecl-wgpu = { version = "=0.11.3", default-features = false }
wasm-bindgen = "0.2.105"
wasm-bindgen-futures = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Performance", "Window", "Document", "HtmlVideoElement", "HtmlCanvasElement"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
